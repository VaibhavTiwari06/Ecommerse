# ================================================================
# E-Bookstore Backend — Application Configuration
# Application-specific values must be provided via environment
# variables. Do NOT commit secrets or credentials to this file.
# ================================================================

spring.application.name=ebookstore-backend

# ----------------------------------------------------------------
# Server
# ----------------------------------------------------------------
server.port=8080

# ----------------------------------------------------------------
# Database — values injected from environment variables
# ----------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------------
# Actuator — expose health only by default
# ----------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ----------------------------------------------------------------
# Logging
# ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ebookstore=DEBUG
