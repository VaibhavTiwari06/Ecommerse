# ================================================================
# E-Bookstore Backend — Application Configuration
# Application-specific values must be provided via environment
# variables. Do NOT commit secrets or credentials to this file.
# ================================================================

spring.application.name=ebookstore-backend

# ----------------------------------------------------------------
# Server
# ----------------------------------------------------------------
server.port=8080

# ----------------------------------------------------------------
# Database — values injected from environment variables
# ----------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=validate means Hibernate checks that the database schema
# matches the JPA entities but does NOT create or alter any tables.
# All schema changes go through Flyway migrations — never through Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------------
# Flyway — database schema migration (TASK-FOUND-002, REQ-NFR-001)
# Flyway scans classpath:db/migration for SQL files named V{n}__{desc}.sql
# and runs any that have not been applied yet.
# baseline-on-migrate=true creates the flyway_schema_history table
# automatically on first run even if the DB already has tables.
# ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ----------------------------------------------------------------
# JWT — secret and expiry (TASK-AUTH-003, REQ-NFR-001, REQ-NFR-005)
# The actual secret value is injected from the JWT_SECRET environment
# variable — it is NEVER hardcoded here.
# expiration-ms = 86400000 = 24 hours in milliseconds.
# ----------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------------
# Actuator — expose health only (TASK-FOUND-001)
# show-details=never means /actuator/health only shows {"status":"UP"}
# and does not leak internal DB status to unauthenticated callers.
# ----------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ----------------------------------------------------------------
# Logging — REQ-NFR-006
# Root stays at INFO. Our own packages log at DEBUG during development.
# NEVER log passwords, tokens, card details, or any PII.
# ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ebookstore=DEBUG
