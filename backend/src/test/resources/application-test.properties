# =============================================================
# application-test.properties — Test profile configuration
# =============================================================
# This file is active ONLY when @ActiveProfiles("test") is used
# in a test class. It overrides the main application.properties
# so that tests run without a real PostgreSQL database or any
# real environment variables.
#
# WHY H2 INSTEAD OF POSTGRESQL IN TESTS?
#   Tests must be self-contained and runnable by any developer
#   without a running database. H2 is an in-memory SQL database
#   that starts and stops within the JVM — perfect for unit and
#   integration tests.
#
# WHY ddl-auto=create-drop?
#   In the test profile we let Hibernate create the schema from
#   JPA entity definitions (instead of running Flyway migrations).
#   This keeps tests fast and isolated. The schema is dropped when
#   the test context shuts down.
#
# WHY spring.flyway.enabled=false?
#   Flyway is disabled in tests because:
#   a) H2 is not supported by flyway-database-postgresql
#   b) We use Hibernate ddl-auto=create-drop instead
# =============================================================

# H2 in-memory database — no external process needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entity definitions for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests — schema is managed by Hibernate here
spring.flyway.enabled=false

# Stub JWT secret — must be at least 32 characters for HS256
# This is a test-only value, not used in production
app.jwt.secret=test-only-secret-key-for-unit-tests-not-production
app.jwt.expiration-ms=86400000
